name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Deploy oficial roda no Azure DevOps (azure-pipelines.yml); aqui o deploy é só manual.
  workflow_dispatch:

concurrency:
  group: deploy-catalog-api
  cancel-in-progress: false

env:
  ACR: acrfiapyuri
  RG: rg-fcg
  AKS: aks-fcg
  NS: fcg
  APP: catalog-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes unitários
        run: dotnet test tests/Catalog.Tests/Catalog.Tests.csproj -c Release

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build e push da imagem (tag = commit)
        run: |
          TAG=sha-${GITHUB_SHA::7}
          IMG=$ACR.azurecr.io/$APP:$TAG
          az acr login --name $ACR
          docker build -t $IMG .
          docker push $IMG
          echo "TAG=$TAG" >> $GITHUB_ENV

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RG }}
          cluster-name: ${{ env.AKS }}

      - name: Deploy (rolling update)
        run: |
          sed -i "s/IMAGE_TAG/$TAG/" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl -n $NS rollout status deployment/$APP --timeout=300s
